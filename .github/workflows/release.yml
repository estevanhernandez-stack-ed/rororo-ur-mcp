name: release

# Tag push v* -> build the three-artifact release RoRoRo's installer expects:
# manifest.json + manifest.sha256 + plugin.zip. Same shape as ur-task's.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test tests/rororo-ur-mcp.Tests/rororo-ur-mcp.Tests.csproj -c Release --nologo

      - name: Build plugin artifacts
        shell: pwsh
        run: ./build/build-plugin.ps1

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/manifest.json
            artifacts/manifest.sha256
            artifacts/plugin.zip
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') }}
          generate_release_notes: true
          draft: false
