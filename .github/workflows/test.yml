name: test

# Standalone, the family's fast shape: the contract comes from NuGet (0.9.0+), so no sibling
# checkout is needed anywhere.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test tests/rororo-ur-mcp.Tests/rororo-ur-mcp.Tests.csproj -c Release --nologo
