name: test

# One job, with the sibling-host checkout unconditionally: unlike ur-task, this repo's MAIN
# csproj ProjectReferences the contract (ROROROblox.PluginContract 0.9.0 is unpublished), so
# there is no standalone leg yet. When the contract NuGet is pushed and the csproj swaps to a
# PackageReference, this collapses to the family's fast standalone shape.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: windows-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v6
        with:
          path: rororo-ur-mcp

      - name: Checkout host (sibling layout the csproj expects)
        uses: actions/checkout@v6
        with:
          repository: estevanhernandez-stack-ed/ROROROblox
          path: ROROROblox

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Test
        working-directory: rororo-ur-mcp
        run: >-
          dotnet test tests/rororo-ur-mcp.Tests/rororo-ur-mcp.Tests.csproj
          -c Release
          --nologo
